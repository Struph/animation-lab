<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Book Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment: #e8d4a8;
      --ink: #2a1c12;
      --gold: #d4b46a;
      --leather-alliance: #1a3d6e;
      --leather-horde: #6e1c18;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "IM Fell English", Georgia, serif;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(90, 55, 28, 0.45), transparent 55%),
        linear-gradient(160deg, #1a120c 0%, #0d0907 55%, #120c08 100%);
    }

    .scene {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      color: #f0d9a4;
    }

    .topbar h1 {
      margin: 0;
      font-family: Cinzel, serif;
      font-size: clamp(1rem, 3vw, 1.45rem);
      letter-spacing: 0.04em;
    }

    .hint {
      margin: 0 0 14px;
      color: #cfb583;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls select,
    .controls button {
      border: 1px solid #8a6a3b;
      background: linear-gradient(180deg, #3a2818, #24170f);
      color: #f0d9a4;
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
    }

    .controls button { cursor: pointer; }

    .stage {
      position: relative;
      width: min(980px, 100%);
      margin: 0 auto;
      aspect-ratio: 16 / 11;
      min-height: 420px;
      perspective: 1600px;
    }

    .book {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    /* ===== CLOSED COVER ===== */
    .cover {
      position: absolute;
      inset: 6% 18% 8% 18%;
      border-radius: 10px 14px 14px 10px;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease;
      z-index: 20;
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.55),
        inset 0 0 0 2px rgba(212, 180, 106, 0.28),
        inset 0 0 40px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .cover.alliance {
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 220, 140, 0.18), transparent 28%),
        linear-gradient(145deg, #2b5e9e 0%, #16325c 45%, #0d1d36 100%);
    }

    .cover.horde {
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 180, 90, 0.16), transparent 28%),
        linear-gradient(145deg, #8f2d24 0%, #5a1713 45%, #2d0c0a 100%);
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, transparent 0 3px, rgba(0,0,0,0.03) 3px 4px),
        repeating-linear-gradient(0deg, transparent 0 4px, rgba(255,255,255,0.02) 4px 5px);
      opacity: 0.55;
      pointer-events: none;
    }

    .cover-ornament {
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(212, 180, 106, 0.35);
      border-radius: 8px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #f7eccf;
      padding: 16px;
    }

    .crest {
      width: 84px;
      height: 84px;
      margin: 0 auto 10px;
      border-radius: 50%;
      border: 2px solid rgba(212, 180, 106, 0.7);
      display: grid;
      place-items: center;
      font-family: Cinzel, serif;
      font-size: 2rem;
      background: radial-gradient(circle, rgba(0,0,0,0.15), rgba(0,0,0,0.45));
      box-shadow: inset 0 0 18px rgba(0,0,0,0.4);
    }

    .cover-title {
      font-family: Cinzel, serif;
      font-size: clamp(1.1rem, 3vw, 1.7rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cover-sub {
      margin-top: 6px;
      opacity: 0.85;
      font-size: 0.95rem;
    }

    .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 2px solid rgba(212, 180, 106, 0.75);
      opacity: 0.9;
    }
    .corner.tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
    .corner.tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
    .corner.bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; }
    .corner.br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }

    /* ===== OPEN BOOK SHELL ===== */
    .open-book {
      position: absolute;
      inset: 4% 2% 10% 2%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease 0.15s;
    }

    .leather {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      background:
        linear-gradient(90deg, #2a1a12 0%, #3a2418 8%, #2a1a12 14%, #3a2418 86%, #2a1a12 92%, #1d120c 100%);
      box-shadow: 0 28px 55px rgba(0,0,0,0.55);
    }

    .leather::before,
    .leather::after {
      content: "";
      position: absolute;
      top: 8%;
      bottom: 8%;
      width: 18px;
      background: linear-gradient(180deg, #6a4a2c, #3d2818);
      border-radius: 4px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.45);
    }
    .leather::before { left: 1.5%; }
    .leather::after { right: 1.5%; }

    .pages {
      position: absolute;
      inset: 5% 4% 9% 4%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      transform-style: preserve-3d;
    }

    .page {
      position: relative;
      padding: clamp(14px, 2.4vw, 28px);
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.25), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(120, 70, 30, 0.14), transparent 40%),
        linear-gradient(180deg, #f0dfb8 0%, #e4c995 55%, #d9ba84 100%);
      box-shadow: inset 0 0 30px rgba(90, 55, 20, 0.18);
    }

    .page.left {
      border-radius: 8px 0 0 8px;
      clip-path: polygon(0% 2%, 2% 0%, 98% 0%, 100% 1%, 100% 99%, 98% 100%, 2% 100%, 0% 98%);
      box-shadow:
        inset -18px 0 24px rgba(90, 55, 20, 0.12),
        inset 0 0 30px rgba(90, 55, 20, 0.18);
    }

    .page.right {
      border-radius: 0 8px 8px 0;
      clip-path: polygon(0% 1%, 2% 0%, 98% 0%, 100% 2%, 100% 98%, 98% 100%, 2% 100%, 0% 99%);
      box-shadow:
        inset 18px 0 24px rgba(90, 55, 20, 0.12),
        inset 0 0 30px rgba(90, 55, 20, 0.18);
    }

    .spine-shadow {
      position: absolute;
      top: 5%;
      bottom: 9%;
      left: 50%;
      width: 28px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, rgba(0,0,0,0.22), rgba(0,0,0,0.05), rgba(0,0,0,0.22));
      pointer-events: none;
      z-index: 5;
    }

    .page h2 {
      margin: 0 0 10px;
      font-family: Cinzel, serif;
      font-size: clamp(1rem, 2.4vw, 1.45rem);
      letter-spacing: 0.03em;
    }

    .page p {
      margin: 0;
      line-height: 1.45;
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
    }

    .page .meta {
      margin-top: 14px;
      opacity: 0.75;
      font-style: italic;
      font-size: 0.9rem;
    }

    .illum {
      float: left;
      width: 42px;
      height: 42px;
      margin: 0 8px 0 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(90, 55, 20, 0.35);
      background: rgba(180, 120, 50, 0.12);
      font-family: Cinzel, serif;
      font-size: 1.5rem;
    }

    /* ===== FLIPPING PAGE (real turn) ===== */
    .flipper {
      position: absolute;
      top: 5%;
      right: 4%;
      width: calc(50% - 2%);
      height: 86%;
      transform-origin: left center;
      transform-style: preserve-3d;
      z-index: 8;
      pointer-events: none;
      opacity: 0;
    }

    .flipper.is-flipping {
      opacity: 1;
      animation: flipPage 0.7s ease-in-out forwards;
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 0 8px 8px 0;
      background:
        linear-gradient(180deg, #f0dfb8 0%, #e4c995 55%, #d9ba84 100%);
      box-shadow: inset 18px 0 24px rgba(90, 55, 20, 0.12);
      overflow: hidden;
      padding: clamp(14px, 2.4vw, 28px);
    }

    .flip-face.back {
      transform: rotateY(180deg);
      background:
        linear-gradient(180deg, #e8d2a4 0%, #dcc28c 100%);
    }

    .flip-face.front::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.0), rgba(255,255,255,0.22), rgba(0,0,0,0.08));
      pointer-events: none;
    }

    @keyframes flipPage {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(-180deg); }
    }

    /* ===== RIBBON BOOKMARKS ===== */
    .bookmarks {
      position: absolute;
      left: 50%;
      bottom: 1%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .bookmark {
      width: 34px;
      height: 54px;
      border: 0;
      padding: 0;
      cursor: pointer;
      background: transparent;
      position: relative;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35));
    }

    .bookmark span {
      position: absolute;
      inset: 0;
      clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
      display: grid;
      place-items: center;
      color: #f8e7bd;
      font-family: Cinzel, serif;
      font-size: 0.75rem;
      font-weight: 700;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .bookmark:nth-child(1) span { background: linear-gradient(180deg, #5b5b5b, #2f2f2f); }
    .bookmark:nth-child(2) span { background: linear-gradient(180deg, #8a2f28, #5a1713); }
    .bookmark:nth-child(3) span { background: linear-gradient(180deg, #2f5f98, #17355c); }
    .bookmark:nth-child(4) span { background: linear-gradient(180deg, #7a6233, #4b3a1c); }

    .bookmark:hover span { transform: translateY(-3px); }
    .bookmark.active span {
      filter: brightness(1.2);
      box-shadow: 0 0 0 2px rgba(255, 220, 126, 0.45);
    }

    /* ===== OPEN STATE ===== */
    .book.is-open .cover {
      transform: rotateY(-105deg) translateX(-4%);
      opacity: 0;
      pointer-events: none;
    }

    .book.is-open .open-book {
      opacity: 1;
      pointer-events: auto;
    }

    .book.is-open .bookmarks {
      opacity: 1;
      pointer-events: auto;
    }

    .book.is-flipping .page.right {
      opacity: 0.35;
    }

    @media (max-width: 760px) {
      .stage {
        aspect-ratio: auto;
        min-height: 640px;
      }

      .cover {
        inset: 4% 8% 28% 8%;
      }

      .open-book {
        inset: 2% 1% 18% 1%;
      }

      .pages {
        grid-template-columns: 1fr;
        inset: 4% 5% 20% 5%;
        gap: 8px;
      }

      .page.left,
      .page.right {
        border-radius: 8px;
        min-height: 180px;
      }

      .spine-shadow { display: none; }

      .flipper {
        top: 4%;
        right: 5%;
        width: 90%;
        height: 42%;
      }

      .bookmarks {
        bottom: 2%;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <header class="topbar">
      <h1>Codex of Tales</h1>
      <div class="controls">
        <label for="factionSelect">Fraktion</label>
        <select id="factionSelect">
          <option value="alliance">Allianz</option>
          <option value="horde">Horde</option>
        </select>
        <button id="openBookBtn" type="button">Buch oeffnen</button>
        <button id="closeBookBtn" type="button">Schliessen</button>
      </div>
    </header>

    <p class="hint">Oeffnen -> Cover klappt auf. Unten Lesezeichen tippen -> Seite blaettert sichtbar um.</p>

    <section class="stage">
      <div id="book" class="book">
        <div id="cover" class="cover alliance">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div class="cover-ornament">
            <div>
              <div id="crest" class="crest">A</div>
              <div id="coverTitle" class="cover-title">Allianz Chronik</div>
              <div class="cover-sub">Codex of Tales</div>
            </div>
          </div>
        </div>

        <div class="open-book">
          <div class="leather"></div>
          <div class="pages">
            <article class="page left">
              <div class="illum" id="leftIllum">H</div>
              <h2 id="leftTitle">Kapitel</h2>
              <p id="leftBody">Platzhalter links.</p>
              <p class="meta" id="leftMeta">Seite A</p>
            </article>
            <article class="page right">
              <h2 id="rightTitle">Quest</h2>
              <p id="rightBody">Platzhalter rechts.</p>
              <p class="meta" id="rightMeta">Seite B</p>
            </article>
          </div>
          <div class="spine-shadow"></div>

          <div id="flipper" class="flipper" aria-hidden="true">
            <div class="flip-face front">
              <h2 id="flipFrontTitle">...</h2>
              <p id="flipFrontBody">...</p>
            </div>
            <div class="flip-face back">
              <h2 id="flipBackTitle">...</h2>
              <p id="flipBackBody">...</p>
            </div>
          </div>
        </div>

        <nav id="bookmarks" class="bookmarks" aria-label="Lesezeichen"></nav>
      </div>
    </section>
  </main>

  <script>
    const pages = [
      {
        leftTitle: "Heldbrecher-Chronik",
        leftBody: "Platzhalter-Lore links. Hier spaeter Illustration, Text und Karte wie in deinem Buch.",
        leftMeta: "Kapitel I · Platzhalter",
        rightTitle: "Die verlorene Festung",
        rightBody: "ZIEL: Sammle 8 verwitterte Runensteine. Fortschritt und Belohnungen kommen spaeter hierhin.",
        rightMeta: "Quest · Platzhalter",
        marker: "I",
        illum: "H",
      },
      {
        leftTitle: "Schatten-Chronik",
        leftBody: "Zweiter Abschnitt. Spaeter NPC-Notizen, Kartenausschnitte oder Fraktionslore.",
        leftMeta: "Kapitel II · Platzhalter",
        rightTitle: "Ruinen von Andorhal",
        rightBody: "Questziele, Checkliste und Zwischenstand. Alles noch Platzhalter.",
        rightMeta: "Quest · Platzhalter",
        marker: "II",
        illum: "S",
      },
      {
        leftTitle: "Bestiarium",
        leftBody: "Dritte Doppelseite. Hier spaeter Skizzen und Gegnerbeschreibungen.",
        leftMeta: "Kapitel III · Platzhalter",
        rightTitle: "Belohnungen",
        rightBody: "Gold, Ausruestung, Ruf — spaeter echte Icons statt Platzhalter.",
        rightMeta: "Loot · Platzhalter",
        marker: "III",
        illum: "B",
      },
      {
        leftTitle: "Dungeon Log",
        leftBody: "Vierte Doppelseite fuer Notizen, Raidtaktik oder Tagebucheintraege.",
        leftMeta: "Kapitel IV · Platzhalter",
        rightTitle: "Feldnotizen",
        rightBody: "Freier Platz fuer Marker, Orte und persoenliche Eintraege.",
        rightMeta: "Notizen · Platzhalter",
        marker: "IV",
        illum: "D",
      },
    ];

    const book = document.getElementById("book");
    const cover = document.getElementById("cover");
    const crest = document.getElementById("crest");
    const coverTitle = document.getElementById("coverTitle");
    const factionSelect = document.getElementById("factionSelect");
    const openBookBtn = document.getElementById("openBookBtn");
    const closeBookBtn = document.getElementById("closeBookBtn");
    const bookmarks = document.getElementById("bookmarks");
    const flipper = document.getElementById("flipper");

    let currentPage = 0;
    let isFlipping = false;

    function setFaction(faction) {
      cover.classList.toggle("alliance", faction === "alliance");
      cover.classList.toggle("horde", faction === "horde");
      if (faction === "horde") {
        crest.textContent = "H";
        coverTitle.textContent = "Horde Kodex";
      } else {
        crest.textContent = "A";
        coverTitle.textContent = "Allianz Chronik";
      }
    }

    function renderPage(index) {
      const page = pages[index];
      document.getElementById("leftIllum").textContent = page.illum;
      document.getElementById("leftTitle").textContent = page.leftTitle;
      document.getElementById("leftBody").textContent = page.leftBody;
      document.getElementById("leftMeta").textContent = page.leftMeta;
      document.getElementById("rightTitle").textContent = page.rightTitle;
      document.getElementById("rightBody").textContent = page.rightBody;
      document.getElementById("rightMeta").textContent = page.rightMeta;

      bookmarks.querySelectorAll(".bookmark").forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });
    }

    function flipTo(targetIndex) {
      if (!book.classList.contains("is-open")) return;
      if (isFlipping || targetIndex === currentPage || !pages[targetIndex]) return;

      isFlipping = true;
      book.classList.add("is-flipping");

      const from = pages[currentPage];
      const to = pages[targetIndex];

      document.getElementById("flipFrontTitle").textContent = from.rightTitle;
      document.getElementById("flipFrontBody").textContent = from.rightBody;
      document.getElementById("flipBackTitle").textContent = to.rightTitle;
      document.getElementById("flipBackBody").textContent = to.rightBody;

      flipper.classList.remove("is-flipping");
      void flipper.offsetWidth;
      flipper.classList.add("is-flipping");

      const onDone = () => {
        currentPage = targetIndex;
        renderPage(currentPage);
        flipper.classList.remove("is-flipping");
        book.classList.remove("is-flipping");
        isFlipping = false;
        flipper.removeEventListener("animationend", onDone);
      };

      flipper.addEventListener("animationend", onDone);
    }

    function createBookmarks() {
      pages.forEach((page, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "bookmark";
        btn.innerHTML = `<span>${page.marker}</span>`;
        btn.addEventListener("click", () => flipTo(index));
        bookmarks.appendChild(btn);
      });
    }

    openBookBtn.addEventListener("click", () => {
      book.classList.add("is-open");
    });

    closeBookBtn.addEventListener("click", () => {
      book.classList.remove("is-open");
    });

    factionSelect.addEventListener("change", (e) => setFaction(e.target.value));

    createBookmarks();
    setFaction("alliance");
    renderPage(0);
  </script>
</body>
</html>
