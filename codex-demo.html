<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Book Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #f0d9a4;
      font-family: "IM Fell English", Georgia, serif;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(70, 42, 22, 0.55), transparent 55%),
        linear-gradient(160deg, #17100c 0%, #090705 100%);
    }

    .scene {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .topbar h1 {
      margin: 0;
      font-family: Cinzel, serif;
      font-size: clamp(1rem, 3vw, 1.4rem);
      letter-spacing: 0.04em;
    }

    .hint {
      margin: 0 0 14px;
      color: #cfb583;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls select,
    .controls button {
      border: 1px solid #8a6a3b;
      background: linear-gradient(180deg, #3a2818, #24170f);
      color: #f0d9a4;
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    .stage {
      position: relative;
      width: min(980px, 100%);
      margin: 0 auto;
      min-height: min(72vh, 640px);
      perspective: 1800px;
    }

    .book {
      position: relative;
      width: 100%;
      min-height: min(72vh, 640px);
      transform-style: preserve-3d;
    }

    /* Closed cover: portrait book from your image */
    .cover-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 30;
      transition: opacity 0.35s ease, transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform-origin: left center;
    }

    .cover-wrap img {
      width: min(340px, 58vw);
      height: auto;
      max-height: min(68vh, 560px);
      object-fit: contain;
      filter: drop-shadow(0 22px 36px rgba(0, 0, 0, 0.6));
      user-select: none;
      pointer-events: none;
    }

    /* Open book: full artwork */
    .open-book {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease 0.15s;
    }

    .open-book .book-art {
      width: min(960px, 96%);
      height: auto;
      max-height: min(70vh, 620px);
      object-fit: contain;
      filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.55));
      user-select: none;
      pointer-events: none;
    }

    /* Flip layer aligned to right page of artwork */
    .flipper {
      position: absolute;
      top: 18%;
      right: 14%;
      width: 34%;
      height: 62%;
      transform-origin: left center;
      transform-style: preserve-3d;
      z-index: 12;
      pointer-events: none;
      opacity: 0;
    }

    .flipper.is-flipping {
      opacity: 1;
      animation: flipPage 0.78s ease-in-out forwards;
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 2px 10px 10px 2px;
      overflow: hidden;
      background: center / cover no-repeat url("assets/page-flip.webp");
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
    }

    .flip-face.front::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.18), transparent 22%, rgba(255,255,255,0.12));
    }

    .flip-face.back {
      transform: rotateY(180deg);
      filter: brightness(0.92);
    }

    .flip-face .caption {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 12%;
      color: #2a1c12;
      font-family: Cinzel, serif;
      font-size: clamp(0.75rem, 1.5vw, 1rem);
      text-shadow: 0 1px 0 rgba(255, 240, 210, 0.35);
    }

    @keyframes flipPage {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(-180deg); }
    }

    .bookmarks {
      position: absolute;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .bookmark {
      width: 34px;
      height: 54px;
      border: 0;
      padding: 0;
      cursor: pointer;
      background: transparent;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.45));
    }

    .bookmark span {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
      color: #f8e7bd;
      font-family: Cinzel, serif;
      font-size: 0.72rem;
      font-weight: 700;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .bookmark:nth-child(1) span { background: linear-gradient(180deg, #666, #2c2c2c); }
    .bookmark:nth-child(2) span { background: linear-gradient(180deg, #8a2f28, #4f1410); }
    .bookmark:nth-child(3) span { background: linear-gradient(180deg, #2f5f98, #153152); }
    .bookmark:nth-child(4) span { background: linear-gradient(180deg, #7a6233, #433417); }

    .bookmark:hover span { transform: translateY(-3px); }
    .bookmark.active span {
      filter: brightness(1.25);
      outline: 2px solid rgba(255, 220, 126, 0.55);
    }

    .status {
      margin-top: 10px;
      text-align: center;
      color: #d7bf8e;
      min-height: 1.2em;
      font-size: 0.95rem;
    }

    .book.is-open .cover-wrap {
      transform: rotateY(-108deg) translateX(-8%);
      opacity: 0;
      pointer-events: none;
    }

    .book.is-open .open-book {
      opacity: 1;
      pointer-events: auto;
    }

    .book.is-open .bookmarks {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 760px) {
      .stage, .book { min-height: 560px; }
      .cover-wrap img { width: min(280px, 70vw); }
      .open-book .book-art { max-height: 420px; }
      .flipper {
        top: 22%;
        right: 8%;
        width: 42%;
        height: 48%;
      }
      .bookmarks { bottom: 1%; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <header class="topbar">
      <h1>Codex of Tales</h1>
      <div class="controls">
        <label for="factionSelect">Fraktion</label>
        <select id="factionSelect">
          <option value="alliance">Allianz</option>
          <option value="horde">Horde</option>
        </select>
        <button id="openBookBtn" type="button">Buch oeffnen</button>
        <button id="closeBookBtn" type="button">Schliessen</button>
      </div>
    </header>

    <p class="hint">Echte Cover + offenes Buch aus deinen GitHub-Bildern. Lesezeichen = Blatter-Animation.</p>

    <section class="stage">
      <div id="book" class="book">
        <div class="cover-wrap">
          <img id="coverImg" src="assets/cover-alliance.webp" alt="Allianz Chronik Cover">
        </div>

        <div class="open-book">
          <img class="book-art" src="assets/book-open.webp" alt="Offenes Codex Buch">

          <div id="flipper" class="flipper" aria-hidden="true">
            <div class="flip-face front">
              <div class="caption" id="flipFrontLabel"></div>
            </div>
            <div class="flip-face back">
              <div class="caption" id="flipBackLabel"></div>
            </div>
          </div>
        </div>

        <nav id="bookmarks" class="bookmarks" aria-label="Lesezeichen"></nav>
      </div>
    </section>

    <p id="status" class="status">Aktuelle Seite: Heldbrecher-Chronik</p>
  </main>

  <script>
    const chapters = [
      { marker: "I", label: "Heldbrecher-Chronik" },
      { marker: "II", label: "Schatten-Chronik" },
      { marker: "III", label: "Bestiarium" },
      { marker: "IV", label: "Dungeon Log" },
    ];

    const book = document.getElementById("book");
    const coverImg = document.getElementById("coverImg");
    const factionSelect = document.getElementById("factionSelect");
    const openBookBtn = document.getElementById("openBookBtn");
    const closeBookBtn = document.getElementById("closeBookBtn");
    const bookmarks = document.getElementById("bookmarks");
    const flipper = document.getElementById("flipper");
    const status = document.getElementById("status");

    let currentPage = 0;
    let isFlipping = false;

    function setFaction(faction) {
      const isHorde = faction === "horde";
      coverImg.src = isHorde ? "assets/cover-horde.webp" : "assets/cover-alliance.webp";
      coverImg.alt = isHorde ? "Horde Kodex Cover" : "Allianz Chronik Cover";
    }

    function renderMarkers() {
      bookmarks.querySelectorAll(".bookmark").forEach((btn, i) => {
        btn.classList.toggle("active", i === currentPage);
      });
      status.textContent = `Aktuelle Seite: ${chapters[currentPage].label}`;
    }

    function flipTo(targetIndex) {
      if (!book.classList.contains("is-open")) return;
      if (isFlipping || targetIndex === currentPage || !chapters[targetIndex]) return;

      isFlipping = true;
      document.getElementById("flipFrontLabel").textContent = chapters[currentPage].label;
      document.getElementById("flipBackLabel").textContent = chapters[targetIndex].label;

      flipper.classList.remove("is-flipping");
      void flipper.offsetWidth;
      flipper.classList.add("is-flipping");

      const onDone = () => {
        currentPage = targetIndex;
        renderMarkers();
        flipper.classList.remove("is-flipping");
        isFlipping = false;
        flipper.removeEventListener("animationend", onDone);
      };

      flipper.addEventListener("animationend", onDone);
    }

    function createBookmarks() {
      chapters.forEach((chapter, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "bookmark";
        btn.title = chapter.label;
        btn.innerHTML = `<span>${chapter.marker}</span>`;
        btn.addEventListener("click", () => flipTo(index));
        bookmarks.appendChild(btn);
      });
    }

    openBookBtn.addEventListener("click", () => book.classList.add("is-open"));
    closeBookBtn.addEventListener("click", () => book.classList.remove("is-open"));
    factionSelect.addEventListener("change", (e) => setFaction(e.target.value));

    createBookmarks();
    setFaction("alliance");
    renderMarkers();
  </script>
</body>
</html>
